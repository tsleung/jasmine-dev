<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Amortization Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #9333ea 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .calculator-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #dc2626;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #dc2626 0%, #9333ea 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            display: none;
            margin-top: 2rem;
        }

        .results.show {
            display: block;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-item {
            background: linear-gradient(135deg, #dc2626 0%, #9333ea 100%);
            padding: 1.5rem;
            border-radius: 12px;
            color: white;
            text-align: center;
        }

        .summary-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .schedule-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: linear-gradient(135deg, #dc2626 0%, #9333ea 100%);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .text-right {
            text-align: right;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .calculator-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Loan Amortization Calculator</h1>

        <div class="calculator-card">
            <div class="input-group">
                <label for="loanAmount">Loan Amount ($)</label>
                <input type="number" id="loanAmount" placeholder="e.g., 200000" step="1000" min="0">
            </div>

            <div class="input-group">
                <label for="interestRate">Annual Interest Rate (%)</label>
                <input type="number" id="interestRate" placeholder="e.g., 5.5" step="0.01" min="0">
            </div>

            <div class="input-group">
                <label for="loanTerm">Loan Term (Years)</label>
                <input type="number" id="loanTerm" placeholder="e.g., 30" step="1" min="1">
            </div>

            <button onclick="calculateAmortization()">Calculate</button>

            <div class="results" id="results">
                <div class="summary">
                    <div class="summary-item">
                        <div class="summary-label">Monthly Payment</div>
                        <div class="summary-value" id="monthlyPayment">$0</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Total Principal</div>
                        <div class="summary-value" id="totalPrincipal">$0</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Total Interest</div>
                        <div class="summary-value" id="totalInterest">$0</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Total Payment</div>
                        <div class="summary-value" id="totalPayment">$0</div>
                    </div>
                </div>

                <div class="schedule-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Payment #</th>
                                <th class="text-right">Payment</th>
                                <th class="text-right">Principal</th>
                                <th class="text-right">Interest</th>
                                <th class="text-right">Balance</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateAmortization() {
            const loanAmount = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('interestRate').value);
            const years = parseInt(document.getElementById('loanTerm').value);

            // Validation
            if (!loanAmount || !annualRate || !years) {
                alert('Please fill in all fields');
                return;
            }

            if (loanAmount <= 0 || annualRate < 0 || years <= 0) {
                alert('Please enter valid positive numbers');
                return;
            }

            // Calculate monthly payment
            const monthlyRate = annualRate / 100 / 12;
            const numPayments = years * 12;

            let monthlyPayment;
            if (monthlyRate === 0) {
                monthlyPayment = loanAmount / numPayments;
            } else {
                monthlyPayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) /
                                (Math.pow(1 + monthlyRate, numPayments) - 1);
            }

            // Generate amortization schedule
            let balance = loanAmount;
            let totalInterest = 0;
            const schedule = [];

            for (let i = 1; i <= numPayments; i++) {
                const interestPayment = balance * monthlyRate;
                const principalPayment = monthlyPayment - interestPayment;
                balance -= principalPayment;
                totalInterest += interestPayment;

                // Prevent negative balance due to floating point precision
                if (balance < 0.01) balance = 0;

                schedule.push({
                    payment: i,
                    monthlyPayment: monthlyPayment,
                    principal: principalPayment,
                    interest: interestPayment,
                    balance: balance
                });
            }

            // Display summary
            document.getElementById('monthlyPayment').textContent = formatCurrency(monthlyPayment);
            document.getElementById('totalPrincipal').textContent = formatCurrency(loanAmount);
            document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
            document.getElementById('totalPayment').textContent = formatCurrency(loanAmount + totalInterest);

            // Display schedule table
            const tableBody = document.getElementById('scheduleTable');
            tableBody.innerHTML = '';

            schedule.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.payment}</td>
                    <td class="text-right">${formatCurrency(row.monthlyPayment)}</td>
                    <td class="text-right">${formatCurrency(row.principal)}</td>
                    <td class="text-right">${formatCurrency(row.interest)}</td>
                    <td class="text-right">${formatCurrency(row.balance)}</td>
                `;
                tableBody.appendChild(tr);
            });

            // Show results
            document.getElementById('results').classList.add('show');
        }

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
        }

        // Allow Enter key to calculate
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        calculateAmortization();
                    }
                });
            });
        });
    </script>
</body>
</html>
